aid: inspiren
name: Inspiren
description: 'Inspiren is a healthcare technology company providing an AI-powered ecosystem
  for senior living communities that combines hardware and software to improve resident
  safety, care planning, and staff efficiency. Its platform pairs devices such as the
  AUGi sensor, Sense, Help Button, Resident Pendant, and Staff Beacon with the Inspiren
  HQ software platform and mobile app to deliver emergency call, real-time fall prevention
  and safety monitoring, data-driven care insights, and staff workflow coordination.
  Inspiren reports outcomes including reductions in falls, faster alert response times,
  and improved occupancy for the communities it serves. This profile was surfaced as a
  portfolio company of Insight Partners and Scale Venture Partners and added to the API
  Evangelist network; Inspiren does not publish a public developer program, API documentation,
  or machine-readable API specifications at this time.'
